name: Build APK (Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Build do APK (debug — instalação direta no celular)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GestouEntregador.apk

      - name: Publicar no Releases (tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GestouEntregador.apk

      - name: Guardar artefato (runs manuais)
        uses: actions/upload-artifact@v4
        with:
          name: GestouEntregador
          path: GestouEntregador.apk
