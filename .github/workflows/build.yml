name: Build APK (Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Build do APK (debug — instalação direta no celular)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GestouEntregador.apk

      # AAB assinado pra Google Play — só quando os secrets do keystore existem
      - name: Restaurar keystore de upload
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/upload.p12

      - name: Build do AAB assinado (Google Play)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android && ./gradlew bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../GestouEntregador.aab

      - name: Publicar no Releases (tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GestouEntregador.*

      - name: Guardar artefato (runs manuais)
        uses: actions/upload-artifact@v4
        with:
          name: GestouEntregador
          path: GestouEntregador.*
